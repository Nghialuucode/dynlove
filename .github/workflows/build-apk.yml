name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Scaffold & Launcher Icon
        run: |
          cd mobile
          flutter create . --platforms=android --project-name=dynlove
          # Cấu hình icon app đẹp
          flutter pub get
          dart run flutter_launcher_icons

          # Cấu hình quyền Internet và cleartext traffic cho Backend
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Build APK Release
        run: |
          cd mobile
          flutter build apk --release


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynlove-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: DynLove MVP v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## 📱 DynLove MVP Android Release
            - Bản build APK tự động từ GitHub Actions.
            - Tải trực tiếp file `app-release.apk` bên dưới về điện thoại Android để cài đặt.
            - Hỗ trợ kết nối Backend qua HTTP / HTTPS và WebSocket.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

