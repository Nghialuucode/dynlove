name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Scaffold
        run: |
          cd mobile
          flutter create . --platforms=android --project-name=dynlove
          # Cho phép HTTP cleartext traffic để test với IP VPS và thêm quyền INTERNET
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK Release
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynlove-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: DynLove MVP v1.0.0 Build ${{ github.run_number }}
          body: |
            ## 📱 DynLove MVP Android Release
            - Bản build APK tự động từ GitHub Actions
            - Hỗ trợ kết nối Backend qua HTTP / HTTPS và WebSocket
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
